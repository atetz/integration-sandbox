<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Integration Sandbox{% endblock %}</title>
    <link rel="stylesheet" href="/ui/static/css/output.css" />
    <script>
      // Seed data-theme before paint so the theme-change toggle (which cycles
      // based on the *explicit* attribute) always starts from the theme the
      // user is actually seeing, instead of an unset attribute that only
      // looks right by coincidence when the OS prefers light mode.
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "luxury"
            : "bumblebee");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script src="/ui/static/js/htmx.min.js"></script>
    <script src="/ui/static/js/theme-change.js"></script>
  </head>
  <body class="min-h-screen bg-base-200">
    {% block content %}{% endblock %}
  </body>
</html>
